# Static client only. API/WS forwarding belongs to the HTTPRoute and Spring Gateway.
# Do not add server secrets or VITE variables here.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # Intentionally exclude query strings and Referer (OAuth/session information).
    log_format safe '$remote_addr - $request_method $uri $server_protocol '
                    '$status $body_bytes_sent $request_time';
    access_log /dev/stdout safe;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;

        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 200 "ok\n";
        }

        # Readiness checks the actual entry file, not only the Nginx process.
        location = /index.html {
            try_files $uri =404;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Only content-hashed Vite build assets are long-cached. Missing assets stay 404.
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location ^~ /images/ {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Defense against returning the SPA HTML for an API or internal request.
        # HTTPRoute sends /api and the public consultation WS path to Spring Gateway.
        location = /api { return 404; }
        location ^~ /api/ { return 404; }
        location = /ws { return 404; }
        location ^~ /ws/ { return 404; }
        location = /internal { return 404; }
        location ^~ /internal/ { return 404; }
        location ~ /\. { return 404; }

        # The dev router already normalizes /auth/callback to /#/auth/callback,
        # preserving only code/signupSessionId. Serve index.html; do not reimplement it.
        # Hash routing itself does not require a fallback, but this callback does.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }
}
